# .github/workflows/release-orchestrator.yml
# Location: 7BytesToDie/7DTD-mod-release-action

name: Release Orchestrator

on:
  workflow_call:
    inputs:
      source_dir:
        required: false
        type: string
        default: mod
      # Optional: callers that omit this (existing mod-repo callers)
      # fall back to github.ref_name, which is the tag on a tag push.
      tag_name:
        required: false
        type: string
    secrets:
      RELEASE_NOTES_TOKEN:
        required: true
      NEXUSMODS_API_KEY:
        required: true
      NEXUSMODS_FILE_GROUP_ID:
        required: true
      NEXUSMODS_MOD_URL:
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pick runner
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t found < <(
            find . -name '*.csproj' -type f \
              -not -path '*/bin/*' -not -path '*/obj/*' \
              -not -path '*/packages/*'
          )
          if [[ ${#found[@]} -gt 0 ]]; then
            echo "runs_on=windows-latest" >> "$GITHUB_OUTPUT"
            echo "Detected .csproj; building on windows-latest"
          else
            echo "runs_on=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "No .csproj; building on ubuntu-latest"
          fi

  release:
    needs: detect
    runs-on: ${{ needs.detect.outputs.runs_on }}
    outputs:
      version:        ${{ steps.mod.outputs.version }}
      body:           ${{ steps.mod.outputs.body }}
      mod_name:       ${{ steps.vars.outputs.mod_name }}
      changelog_name: ${{ steps.vars.outputs.changelog_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libxml2-utils
          version: 1.0

      - name: Derive mod_name, mod_folder, changelog_name
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          src="${{ inputs.source_dir }}"

          # Find all subdirectories that contain ModInfo.xml
          folders=()
          while IFS= read -r -d '' dir; do
            if [[ -f "$dir/ModInfo.xml" ]]; then
              folders+=("$(basename "$dir")")
            fi
          done < <(find "$src" -mindepth 1 -maxdepth 1 -type d -print0)

          if [[ ${#folders[@]} -eq 0 ]]; then
            echo "::error::No subdirectory under '$src' contains a ModInfo.xml."
            exit 1
          fi

          # Sort alphabetically descending and pick the first (the "last").
          folder="$(printf '%s\n' "${folders[@]}" | sort -r | head -n1)"

          # The folder name identifies the mod in the source tree (used for
          # building and validating the archive, and for release titles).
          # The repository name is the stable identity used for the docs
          # repo changelog path, so that renaming the folder in the source
          # tree does not split the changelog across multiple directories.
          changelog_name="${GITHUB_REPOSITORY##*/}"

          echo "mod_name=$folder"               >> "$GITHUB_OUTPUT"
          echo "mod_folder=$folder"             >> "$GITHUB_OUTPUT"
          echo "changelog_name=$changelog_name" >> "$GITHUB_OUTPUT"

      - name: Run Mod Release Action
        id: mod
        uses: 7BytesToDie/7DTD-mod-release-action@main
        with:
          mod_name:   ${{ steps.vars.outputs.mod_name }}
          mod_folder: ${{ steps.vars.outputs.mod_folder }}
          source_dir: ${{ inputs.source_dir }}
          tag_name:   ${{ inputs.tag_name || github.ref_name }}
          refs_token: ${{ secrets.RELEASE_NOTES_TOKEN }}

      # Keep this the LAST step of the job: it only covers failures
      # of steps that run before it.
      - name: Delete tag on failure or cancellation (re-push to retry)
        if: failure() || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Deleting tag ${{ inputs.tag_name || github.ref_name }} due to failure. Fix locally, then re-push the tag."
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/${{ inputs.tag_name || github.ref_name }} || echo "Tag deletion failed or already removed"

  nexus_upload:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      result:     ${{ steps.nexus_upload.outcome }}
      version_id: ${{ steps.nexus_upload.outputs.version_id }}
    steps:
      - name: Download release asset from GitHub
        shell: bash
        run: |
          export GH_TOKEN="${{ github.token }}"
          gh release download "${{ inputs.tag_name || github.ref_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.zip"

      - name: Find the downloaded zip file
        id: zip
        shell: bash
        run: echo "zip=$(ls *.zip | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Fetch mod_id from Nexus API (retry up to 5 times)
        id: nexus_id
        shell: bash
        env:
          MOD_URL: ${{ secrets.NEXUSMODS_MOD_URL }}
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$MOD_URL" =~ https://www\.nexusmods\.com/([^/]+)/mods/([0-9]+) ]]; then
            echo "::error::Invalid NEXUSMODS_MOD_URL format. Expected: https://www.nexusmods.com/{game}/mods/{id}"
            exit 1
          fi

          GAME_DOMAIN="${BASH_REMATCH[1]}"
          GAME_SCOPED_ID="${BASH_REMATCH[2]}"
          API_URL="https://api.nexusmods.com/v3/games/${GAME_DOMAIN}/mods/${GAME_SCOPED_ID}"

          RESPONSE=""
          MOD_ID=""
          for i in {1..5}; do
            if RESPONSE="$(curl -sf -H "apikey: $API_KEY" "$API_URL")"; then
              # /mods/{id}/changelogs takes the mod's unique `id`, not the
              # game-scoped ID that appears in the site URL.
              MOD_ID="$(echo "$RESPONSE" | jq -r '.data.id // empty')"
              [[ -n "$MOD_ID" ]] && break
            fi
            (( i < 5 )) && sleep $(( 2 ** i )) || true
          done

          if [[ -z "$MOD_ID" ]]; then
            echo "::error::Failed to fetch mod_id from Nexus API. Last response: ${RESPONSE:-<empty>}"
            exit 1
          fi

          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "Fetched mod_id: $MOD_ID (game-scoped ID from URL: $GAME_SCOPED_ID)"

      - name: Upload mod to NexusMods
        id: nexus_upload
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.zip.outputs.zip }}
          display_name: ${{ needs.release.outputs.mod_name }}-${{ needs.release.outputs.version }}
          description: "[url=https://raw.githubusercontent.com/7BytesToDie/mods/main/${{ needs.release.outputs.changelog_name }}/changelog.md]Full changelog[/url]"
          version: ${{ needs.release.outputs.version }}
          changelog: ${{ needs.release.outputs.body }}
          mod_id: ${{ steps.nexus_id.outputs.mod_id }}
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          archive_existing_version: true
          update_mod_version: true

  changelog:
    needs: [release, nexus_upload]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-notes-writer
      cancel-in-progress: false
    steps:
      - name: Checkout release notes repository
        uses: actions/checkout@v6
        with:
          repository: 7BytesToDie/mods
          token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          path: notes

      - name: Update changelog (prepend new version)
        shell: bash
        env:
          MOD_NAME:       ${{ needs.release.outputs.mod_name }}
          CHANGELOG_NAME: ${{ needs.release.outputs.changelog_name }}
          VERSION:        ${{ needs.release.outputs.version }}
          BODY:           ${{ needs.release.outputs.body }}
        run: |
          set -euo pipefail
          MOD_DIR="notes/${CHANGELOG_NAME}"
          CHANGELOG="${MOD_DIR}/changelog.md"
          mkdir -p "$MOD_DIR"

          if [ -f "$CHANGELOG" ] && grep -qxF "# ${MOD_NAME} ${VERSION}" "$CHANGELOG"; then
            echo "Version ${VERSION} already present in ${CHANGELOG}; skipping."
            exit 0
          fi

          NEW_ENTRY_FILE="${CHANGELOG}.new"
          cat > "$NEW_ENTRY_FILE" <<CHANGELOG_ENTRY_EOF
          # ${MOD_NAME} ${VERSION}

          ${BODY}

          CHANGELOG_ENTRY_EOF

          if [ -f "$CHANGELOG" ]; then
            cat "$NEW_ENTRY_FILE" "$CHANGELOG" > "${CHANGELOG}.tmp"
            mv "${CHANGELOG}.tmp" "$CHANGELOG"
          else
            mv "$NEW_ENTRY_FILE" "$CHANGELOG"
          fi
          rm -f "$NEW_ENTRY_FILE"

      - name: Commit and push changelog
        shell: bash
        run: |
          set -euo pipefail
          cd notes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Add ${{ needs.release.outputs.changelog_name }} ${{ needs.release.outputs.version }}"
          git push

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## Release summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Mod**: ${{ needs.release.outputs.mod_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag_name || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nexus page**: ${{ secrets.NEXUSMODS_MOD_URL }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.nexus_upload.outputs.result }}" == "failure" ]; then
            echo "- **Nexus upload**: failed (see warnings above)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Nexus version ID**: ${{ needs.nexus_upload.outputs.version_id }}" >> $GITHUB_STEP_SUMMARY
          fi

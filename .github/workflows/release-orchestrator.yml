# .github/workflows/release-orchestrator.yml
# Location: 7BytesToDie/7DTD-mod-release-action

name: Release Orchestrator

on:
  workflow_call:
    inputs:
      source_dir:
        required: false
        type: string
        default: mod
      # Optional: callers that omit this (existing mod-repo callers)
      # fall back to github.ref_name, which is the tag on a tag push.
      tag_name:
        required: false
        type: string
      # Optional: leave empty to auto-detect (see locate/action.yml).
      csproj:
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_NOTES_TOKEN:
        required: true
      # Optional: read-only token for the refs repo. RELEASE_NOTES_TOKEN
      # is used when the caller does not pass one.
      REFS_TOKEN:
        required: false
      NEXUSMODS_API_KEY:
        required: true
      NEXUSMODS_FILE_GROUP_ID:
        required: true
      NEXUSMODS_MOD_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      csproj:  ${{ steps.locate.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The same lookup the release action runs, so the runner choice
      # and the project built cannot disagree.
      - name: Locate .csproj
        id: locate
        uses: 7BytesToDie/7DTD-mod-release-action/locate@main
        with:
          csproj: ${{ inputs.csproj }}

      - name: Pick runner
        id: pick
        shell: bash
        env:
          CSPROJ: ${{ steps.locate.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -n "$CSPROJ" ]]; then
            echo "runs_on=windows-latest" >> "$GITHUB_OUTPUT"
            echo "Building $CSPROJ on windows-latest"
          else
            echo "runs_on=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "XML-only mod; packaging on ubuntu-latest"
          fi

  release:
    needs: detect
    runs-on: ${{ needs.detect.outputs.runs_on }}
    permissions:
      contents: write
    outputs:
      version:        ${{ steps.mod.outputs.version }}
      body:           ${{ steps.mod.outputs.body }}
      display_name:   ${{ steps.mod.outputs.display_name }}
      website:        ${{ steps.mod.outputs.website }}
      refs_tag:       ${{ steps.mod.outputs.refs_tag }}
      mod_name:       ${{ steps.vars.outputs.mod_name }}
      changelog_name: ${{ steps.vars.outputs.changelog_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Decides whether a failure may delete the tag: a tag that already
      # has a release is never deleted. Unknown (the lookup itself failed)
      # counts as existing.
      - name: Check for an existing release
        id: prior
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            existed=true
          elif grep -qi 'release not found' <<< "$out"; then
            existed=false
          else
            echo "::warning::Could not check for an existing release of $TAG: $out"
            existed=unknown
          fi
          echo "existed=$existed" >> "$GITHUB_OUTPUT"
          echo "Existing release for $TAG: $existed"

      - name: Derive mod_name, mod_folder, changelog_name
        id: vars
        shell: bash
        env:
          SRC: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail

          # Find all subdirectories that contain ModInfo.xml
          folders=()
          while IFS= read -r -d '' dir; do
            if [[ -f "$dir/ModInfo.xml" ]]; then
              folders+=("$(basename "$dir")")
            fi
          done < <(find "$SRC" -mindepth 1 -maxdepth 1 -type d -print0)

          if [[ ${#folders[@]} -eq 0 ]]; then
            echo "::error::No subdirectory under '$SRC' contains a ModInfo.xml."
            exit 1
          fi

          # Sort alphabetically descending and pick the first (the "last").
          folder="$(printf '%s\n' "${folders[@]}" | sort -r | head -n1)"

          # The folder name identifies the mod in the source tree (used for
          # building and validating the archive, and for the archive and
          # Nexus file names). The repository name is the stable identity
          # used for the docs repo changelog path, so that renaming the
          # folder in the source tree does not split the changelog across
          # multiple directories.
          changelog_name="${GITHUB_REPOSITORY##*/}"

          echo "mod_name=$folder"               >> "$GITHUB_OUTPUT"
          echo "mod_folder=$folder"             >> "$GITHUB_OUTPUT"
          echo "changelog_name=$changelog_name" >> "$GITHUB_OUTPUT"

      - name: Run Mod Release Action
        id: mod
        uses: 7BytesToDie/7DTD-mod-release-action@main
        with:
          mod_name:   ${{ steps.vars.outputs.mod_name }}
          mod_folder: ${{ steps.vars.outputs.mod_folder }}
          source_dir: ${{ inputs.source_dir }}
          tag_name:   ${{ env.TAG }}
          csproj:     ${{ needs.detect.outputs.csproj }}
          refs_token: ${{ secrets.REFS_TOKEN || secrets.RELEASE_NOTES_TOKEN }}

      # Keep this the LAST step of the job: it only covers failures
      # of steps that run before it. Only a pushed tag that has never been
      # released is deleted; a workflow_dispatch re-run keeps its tag.
      - name: Delete tag on failure or cancellation (re-push to retry)
        if: (failure() || cancelled()) && github.event_name == 'push' && steps.prior.outputs.existed == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Deleting tag $TAG due to failure. Fix locally, then re-push the tag."
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || echo "Tag deletion failed or already removed"

  nexus_upload:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result:     ${{ steps.nexus_upload.outcome }}
      version_id: ${{ steps.nexus_upload.outputs.version_id }}
    steps:
      - name: Download release asset from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip"

      - name: Find the downloaded zip file
        id: zip
        shell: bash
        run: echo "zip=$(ls *.zip | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Fetch mod_id from Nexus API (retry up to 5 times)
        id: nexus_id
        shell: bash
        env:
          MOD_URL: ${{ secrets.NEXUSMODS_MOD_URL }}
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$MOD_URL" =~ https://www\.nexusmods\.com/([^/]+)/mods/([0-9]+) ]]; then
            echo "::error::Invalid NEXUSMODS_MOD_URL format. Expected: https://www.nexusmods.com/{game}/mods/{id}"
            exit 1
          fi

          GAME_DOMAIN="${BASH_REMATCH[1]}"
          GAME_SCOPED_ID="${BASH_REMATCH[2]}"
          API_URL="https://api.nexusmods.com/v3/games/${GAME_DOMAIN}/mods/${GAME_SCOPED_ID}"

          RESPONSE=""
          MOD_ID=""
          for i in {1..5}; do
            if RESPONSE="$(curl -sf -H "apikey: $API_KEY" "$API_URL")"; then
              # /mods/{id}/changelogs takes the mod's unique `id`, not the
              # game-scoped ID that appears in the site URL.
              MOD_ID="$(echo "$RESPONSE" | jq -r '.data.id // empty')"
              [[ -n "$MOD_ID" ]] && break
            fi
            (( i < 5 )) && sleep $(( 2 ** i )) || true
          done

          if [[ -z "$MOD_ID" ]]; then
            echo "::error::Failed to fetch mod_id from Nexus API. Last response: ${RESPONSE:-<empty>}"
            exit 1
          fi

          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "Fetched mod_id: $MOD_ID (game-scoped ID from URL: $GAME_SCOPED_ID)"

      - name: Determine game version and mod kind
        id: gameversion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REFS_TOKEN || secrets.RELEASE_NOTES_TOKEN }}
          REFS_TAG: ${{ needs.release.outputs.refs_tag }}
        run: |
          set -euo pipefail

          if [[ -n "$REFS_TAG" ]]; then
            # Compiled mod: the refs release the build actually used.
            GAME_VERSION="$REFS_TAG"
            PREFIX="Compiled against game version"
          else
            GAME_VERSION="$(gh release view --repo 7BytesToDie/7DTD-refs \
                              --json tagName -q .tagName)"
            PREFIX="Target game version"
          fi

          if [[ -z "$GAME_VERSION" || "$GAME_VERSION" == "null" ]]; then
            echo "::error::Could not determine the game version from 7BytesToDie/7DTD-refs."
            exit 1
          fi

          echo "game_version=$GAME_VERSION" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX"             >> "$GITHUB_OUTPUT"
          echo "$PREFIX: $GAME_VERSION"

      - name: Upload mod to NexusMods
        id: nexus_upload
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.zip.outputs.zip }}
          display_name: ${{ needs.release.outputs.mod_name }}-${{ needs.release.outputs.version }}
          description: "${{ steps.gameversion.outputs.prefix }}: ${{ steps.gameversion.outputs.game_version }} [url=https://raw.githubusercontent.com/7BytesToDie/mods/main/${{ needs.release.outputs.changelog_name }}/changelog.md]changelog[/url]"
          version: ${{ needs.release.outputs.version }}
          changelog: ${{ needs.release.outputs.body }}
          mod_id: ${{ steps.nexus_id.outputs.mod_id }}
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          archive_existing_version: false
          update_mod_version: true

  changelog:
    needs: [release, nexus_upload]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-notes-writer
      cancel-in-progress: false
    steps:
      - name: Checkout release notes repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: 7BytesToDie/mods
          token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          path: notes

      - name: Update changelog (prepend new version)
        shell: bash
        env:
          DISPLAY_NAME:   ${{ needs.release.outputs.display_name }}
          CHANGELOG_NAME: ${{ needs.release.outputs.changelog_name }}
          VERSION:        ${{ needs.release.outputs.version }}
          BODY:           ${{ needs.release.outputs.body }}
        run: |
          set -euo pipefail
          MOD_DIR="notes/${CHANGELOG_NAME}"
          CHANGELOG="${MOD_DIR}/changelog.md"
          mkdir -p "$MOD_DIR"

          if [ -f "$CHANGELOG" ] && grep -qxF "# ${DISPLAY_NAME} ${VERSION}" "$CHANGELOG"; then
            echo "Version ${VERSION} already present in ${CHANGELOG}; skipping."
            exit 0
          fi

          NEW_ENTRY_FILE="${CHANGELOG}.new"
          cat > "$NEW_ENTRY_FILE" <<CHANGELOG_ENTRY_EOF
          # ${DISPLAY_NAME} ${VERSION}

          ${BODY}

          CHANGELOG_ENTRY_EOF

          if [ -f "$CHANGELOG" ]; then
            cat "$NEW_ENTRY_FILE" "$CHANGELOG" > "${CHANGELOG}.tmp"
            mv "${CHANGELOG}.tmp" "$CHANGELOG"
          else
            mv "$NEW_ENTRY_FILE" "$CHANGELOG"
          fi
          rm -f "$NEW_ENTRY_FILE"

      - name: Commit and push changelog
        shell: bash
        env:
          CHANGELOG_NAME: ${{ needs.release.outputs.changelog_name }}
          VERSION:        ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          cd notes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Add ${CHANGELOG_NAME} ${VERSION}"
          git push

      - name: Write job summary
        if: always()
        shell: bash
        env:
          DISPLAY_NAME:     ${{ needs.release.outputs.display_name }}
          VERSION:          ${{ needs.release.outputs.version }}
          WEBSITE:          ${{ needs.release.outputs.website }}
          NEXUS_RESULT:     ${{ needs.nexus_upload.outputs.result }}
          NEXUS_VERSION_ID: ${{ needs.nexus_upload.outputs.version_id }}
        run: |
          {
            echo "## Release summary"
            echo "- **Mod**: $DISPLAY_NAME"
            echo "- **Version**: $VERSION"
            echo "- **GitHub Release**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            if [[ -n "$WEBSITE" ]]; then
              echo "- **Mod page**: $WEBSITE"
            fi
            if [[ "$NEXUS_RESULT" == "failure" ]]; then
              echo "- **Nexus upload**: failed (see warnings above)"
            else
              echo "- **Nexus version ID**: $NEXUS_VERSION_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

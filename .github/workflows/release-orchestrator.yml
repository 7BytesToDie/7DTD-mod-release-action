# .github/workflows/release-orchestrator.yml
# Location: 7BytesToDie/7DTD-mod-release-action

name: Release Orchestrator

on:
  workflow_call:
    inputs:
      source_dir:
        required: false
        type: string
        default: mod
    secrets:
      RELEASE_NOTES_TOKEN:
        required: true
      NEXUSMODS_API_KEY:
        required: true
      NEXUSMODS_FILE_GROUP_ID:
        required: true
      NEXUSMODS_MOD_URL:
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version:  ${{ steps.mod.outputs.version }}
      body:     ${{ steps.mod.outputs.body }}
      mod_name: ${{ steps.vars.outputs.mod_name }}
      md5:      ${{ steps.md5.outputs.md5 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libxml2-utils
          version: 1.0

      - name: Derive mod_name and mod_folder
        id: vars
        run: |
          set -euo pipefail
          src="${{ inputs.source_dir }}"

          # Find all subdirectories that contain ModInfo.xml
          folders=()
          while IFS= read -r -d '' dir; do
            if [[ -f "$dir/ModInfo.xml" ]]; then
              folders+=("$(basename "$dir")")
            fi
          done < <(find "$src" -mindepth 1 -maxdepth 1 -type d -print0)

          if [[ ${#folders[@]} -eq 0 ]]; then
            echo "::error::No subdirectory under '$src' contains a ModInfo.xml."
            exit 1
          fi

          # Sort alphabetically descending and pick the first (the "last").
          # printf avoids word-splitting on folder names containing spaces.
          folder="$(printf '%s\n' "${folders[@]}" | sort -r | head -n1)"

          echo "mod_name=$folder"   >> "$GITHUB_OUTPUT"
          echo "mod_folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Run Mod Release Action
        id: mod
        uses: 7BytesToDie/7DTD-mod-release-action@main
        with:
          mod_name:   ${{ steps.vars.outputs.mod_name }}
          mod_folder: ${{ steps.vars.outputs.mod_folder }}
          source_dir: ${{ inputs.source_dir }}
          tag_name:   ${{ github.ref_name }}

      - name: Delete tag on failure (requires new commit + push)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Deleting tag ${{ github.ref_name }} due to failure. Fix locally, then re-push the tag."
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }} || echo "Tag deletion failed or already removed"

      - name: Compute MD5 of the archive
        id: md5
        if: steps.mod.outcome == 'success'
        run: |
          set -euo pipefail
          archive="${{ steps.mod.outputs.archive }}"
          echo "md5=$(md5sum "$archive" | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

  post_release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset from GitHub
        shell: bash
        run: |
          export GH_TOKEN="${{ github.token }}"
          gh release download "${{ github.ref_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.zip"

      - name: Find the downloaded zip file
        id: zip
        run: echo "zip=$(ls *.zip | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Fetch mod_id from Nexus API (retry up to 5 times)
        id: nexus_id
        shell: bash
        env:
          MOD_URL: ${{ secrets.NEXUSMODS_MOD_URL }}
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$MOD_URL" =~ https://www\.nexusmods\.com/([^/]+)/mods/([0-9]+) ]]; then
            echo "::error::Invalid NEXUSMODS_MOD_URL format. Expected: https://www.nexusmods.com/{game}/mods/{id}"
            exit 1
          fi

          GAME_DOMAIN="${BASH_REMATCH[1]}"
          GAME_SCOPED_ID="${BASH_REMATCH[2]}"
          API_URL="https://api.nexusmods.com/v3/games/${GAME_DOMAIN}/mods/${GAME_SCOPED_ID}"

          RESPONSE=""
          MOD_ID=""
          for i in {1..5}; do
            # curl -f fails on HTTP 4xx/5xx so the loop actually retries
            # instead of exiting on the first response.
            if RESPONSE="$(curl -sf -H "apikey: $API_KEY" "$API_URL")"; then
              MOD_ID="$(echo "$RESPONSE" | jq -r '.data.id // empty')"
              [[ -n "$MOD_ID" ]] && break
            fi
            (( i < 5 )) && sleep $(( 2 ** i )) || true
          done

          if [[ -z "$MOD_ID" ]]; then
            echo "::error::Failed to fetch mod_id from Nexus API. Last response: ${RESPONSE:-<empty>}"
            exit 1
          fi

          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "Fetched mod_id: $MOD_ID"

      - name: Upload mod to NexusMods (with graceful duplicate handling)
        id: nexus_upload
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.zip.outputs.zip }}
          name: ${{ needs.release.outputs.mod_name }}-${{ needs.release.outputs.version }}
          description: "[url=https://raw.githubusercontent.com/7BytesToDie/mods/main/${{ needs.release.outputs.mod_name }}/changelog.md]Full changelog[/url]"
          version: ${{ needs.release.outputs.version }}
          changelog: ${{ needs.release.outputs.body }}
          mod_id: ${{ steps.nexus_id.outputs.mod_id }}
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          archive_existing_file: true
          update_mod_version: true
          md5: ${{ needs.release.outputs.md5 }}

        continue-on-error: true

      - name: Handle Nexus upload failure (log but don't fail)
        if: steps.nexus_upload.outcome == 'failure'
        run: |
          echo "::warning::Nexus upload failed. This is usually because version ${{ needs.release.outputs.version }} already exists. Continuing anyway."

      - name: Checkout release notes repository
        uses: actions/checkout@v6
        with:
          repository: 7BytesToDie/mods
          token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          path: notes

      - name: Update changelog (prepend new version)
        if: steps.nexus_upload.outcome != 'failure'
        shell: bash
        env:
          MOD_NAME: ${{ needs.release.outputs.mod_name }}
          VERSION:  ${{ needs.release.outputs.version }}
          BODY:     ${{ needs.release.outputs.body }}
        run: |
          set -euo pipefail
          MOD_DIR="notes/${MOD_NAME}"
          CHANGELOG="${MOD_DIR}/changelog.md"
          mkdir -p "$MOD_DIR"

          NEW_ENTRY_FILE="${CHANGELOG}.new"
          # Non-EOF delimiter so a release body containing "EOF" on its
          # own line cannot terminate the heredoc early.
          cat > "$NEW_ENTRY_FILE" <<CHANGELOG_ENTRY_EOF
          # ${MOD_NAME} ${VERSION}

          ${BODY}

          CHANGELOG_ENTRY_EOF

          if [ -f "$CHANGELOG" ]; then
            cat "$NEW_ENTRY_FILE" "$CHANGELOG" > "${CHANGELOG}.tmp"
            mv "${CHANGELOG}.tmp" "$CHANGELOG"
          else
            mv "$NEW_ENTRY_FILE" "$CHANGELOG"
          fi
          rm -f "$NEW_ENTRY_FILE"

      - name: Commit and push changelog
        if: steps.nexus_upload.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cd notes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Add ${{ needs.release.outputs.mod_name }} ${{ needs.release.outputs.version }}"
          git push

      - name: Write job summary
        if: always()
        run: |
          echo "## Release summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Mod**: ${{ needs.release.outputs.mod_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nexus page**: ${{ secrets.NEXUSMODS_MOD_URL }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Upload successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Workflow partially succeeded (check logs)" >> $GITHUB_STEP_SUMMARY
          fi
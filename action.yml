name: Mod Release Builder
description: Build a distributable mod archive and publish a GitHub Release from an annotated Git tag.

inputs:
  mod_name:
    required: true

  mod_folder:
    required: true

  source_dir:
    required: false
    default: mod

  tag_name:
    required: true

  csproj:
    required: false
    description: |
      Path to the .csproj to build, relative to the repository root.
      Leave empty to auto-detect (see locate/action.yml). If no .csproj
      is found, the build steps are skipped (XML-only mods).

  refs_repo:
    required: false
    default: 7BytesToDie/7dtd-refs

  refs_token:
    required: true
    description: |
      Token with read access to the refs repo's release assets.
      Must be a fine-grained PAT or classic PAT scoped to that repo.

outputs:
  version:
    value: ${{ steps.metadata.outputs.version }}
  archive:
    value: ${{ steps.metadata.outputs.archive }}
  body:
    value: ${{ steps.metadata.outputs.body }}
  display_name:
    description: DisplayName from ModInfo.xml, or mod_name when it has none.
    value: ${{ steps.metadata.outputs.display_name }}
  website:
    description: Website from ModInfo.xml, or empty.
    value: ${{ steps.metadata.outputs.website }}
  dlls:
    description: Newline-separated file names of the DLLs built into the archive; empty for XML-only mods.
    value: ${{ steps.build.outputs.dlls }}
  pdbs:
    description: Newline-separated file names of the PDBs built into the archive; empty for XML-only mods.
    value: ${{ steps.build.outputs.pdbs }}
  refs_tag:
    description: Tag of the refs release the DLLs were compiled against; empty for XML-only mods.
    value: ${{ steps.build.outputs.refs_tag }}

runs:
  using: composite

  steps:
    - name: Prepare metadata
      id: metadata
      shell: bash
      env:
        TAG: ${{ inputs.tag_name }}
        MOD_NAME: ${{ inputs.mod_name }}
        MOD_FOLDER: ${{ inputs.mod_folder }}
        SOURCE_DIR: ${{ inputs.source_dir }}
      run: |
        set -euo pipefail

        VERSION="${TAG#v}"
        MODINFO="$SOURCE_DIR/$MOD_FOLDER/ModInfo.xml"
        ARCHIVE="${MOD_NAME}-${TAG}.zip"

        git tag --list "$TAG" --format='%(contents)' | awk '
          BEGIN { skip=0 }
          /-----BEGIN PGP SIGNATURE-----/ { skip=1 }
          skip == 0 { print }
        ' > release-body.md

        test -s release-body.md || {
          echo "::error::Tag '$TAG' must be annotated and contain release notes."
          exit 1
        }

        test -f "$MODINFO" || {
          echo "::error::Missing ModInfo.xml in primary folder '$MOD_FOLDER'."
          exit 1
        }

        # Python instead of xmllint: Python ships on every GitHub runner.
        modinfo_value() {
          python3 - "$MODINFO" "$1" <<'PY'
        import sys
        import xml.etree.ElementTree as ET
        element = ET.parse(sys.argv[1]).getroot().find(sys.argv[2])
        sys.stdout.write(element.attrib.get("value", "") if element is not None else "")
        PY
        }

        XML_VERSION="$(modinfo_value Version)"
        DISPLAY_NAME="$(modinfo_value DisplayName)"
        WEBSITE="$(modinfo_value Website)"

        test -n "$XML_VERSION" || {
          echo "::error::Unable to read Version/@value from ModInfo.xml."
          exit 1
        }

        if [[ "$XML_VERSION" != "$VERSION" ]]; then
          echo "::error::Version mismatch."
          echo "Tag:         $VERSION"
          echo "ModInfo.xml: $XML_VERSION"
          exit 1
        fi

        # Random-looking delimiter, so a release body containing a
        # line reading exactly 'EOF' cannot truncate the output.
        DELIM="RELEASE_BODY_${RANDOM}_${RANDOM}_${RANDOM}"
        {
          echo "tag=$TAG"
          echo "version=$VERSION"
          echo "archive=$ARCHIVE"
          echo "display_name=${DISPLAY_NAME:-$MOD_NAME}"
          echo "website=$WEBSITE"
          echo "body<<$DELIM"
          cat release-body.md
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

    # Nested actions cannot be referenced relative to this action, so
    # they name the repo explicitly. Keep their ref in step with the ref
    # callers use for this action.
    - name: Locate .csproj
      id: csproj
      uses: 7BytesToDie/7DTD-mod-release-action/locate@main
      with:
        csproj: ${{ inputs.csproj }}

    - name: Build mod
      id: build
      if: steps.csproj.outputs.path != ''
      uses: 7BytesToDie/7DTD-mod-release-action/build@main
      with:
        csproj: ${{ steps.csproj.outputs.path }}
        dest_dir: ${{ inputs.source_dir }}/${{ inputs.mod_folder }}
        refs_repo: ${{ inputs.refs_repo }}
        refs_token: ${{ inputs.refs_token }}

    - name: Build archive
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        ARCHIVE: ${{ steps.metadata.outputs.archive }}
      run: |
        set -euo pipefail
        # Entry timestamps come from the tagged commit, so rebuilding the
        # same tag produces a byte-identical archive.
        SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
        export SOURCE_DATE_EPOCH
        python3 - <<'PY'
        import os
        import time
        import zipfile
        from pathlib import Path

        source = Path(os.environ["SOURCE_DIR"])
        stamp = time.gmtime(int(os.environ["SOURCE_DATE_EPOCH"]))[:6]
        # Archive ALL contents (all subfolders and any files at the root).
        entries = sorted(source.rglob("*"), key=lambda p: p.relative_to(source).as_posix())
        with zipfile.ZipFile(os.environ["ARCHIVE"], "w", zipfile.ZIP_DEFLATED) as archive:
            for path in entries:
                name = path.relative_to(source).as_posix()
                if path.is_dir():
                    info = zipfile.ZipInfo(name + "/", stamp)
                    info.external_attr = (0o40755 << 16) | 0x10
                    data = b""
                else:
                    info = zipfile.ZipInfo(name, stamp)
                    info.external_attr = 0o100644 << 16
                    info.compress_type = zipfile.ZIP_DEFLATED
                    data = path.read_bytes()
                # Same attributes whichever OS builds the archive.
                info.create_system = 3
                archive.writestr(info, data)
        print(f"Wrote {os.environ['ARCHIVE']} with {len(entries)} entries.")
        PY

    - name: Validate archive
      shell: bash
      env:
        ARCHIVE: ${{ steps.metadata.outputs.archive }}
        MOD_FOLDER: ${{ inputs.mod_folder }}
        DLLS: ${{ steps.build.outputs.dlls }}
        PDBS: ${{ steps.build.outputs.pdbs }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        import sys
        import zipfile

        folder = os.environ["MOD_FOLDER"]
        # The primary mod folder's ModInfo.xml, and every DLL and PDB the build staged.
        staged = os.environ["DLLS"].split() + os.environ["PDBS"].split()
        required = [f"{folder}/ModInfo.xml"] + [f"{folder}/{name}" for name in staged]
        with zipfile.ZipFile(os.environ["ARCHIVE"]) as archive:
            names = set(archive.namelist())
        missing = [entry for entry in required if entry not in names]
        for entry in missing:
            print(f"::error::Archive does not contain '{entry}'.")
        if missing:
            sys.exit(1)
        print(f"Archive contains all {len(required)} required entries.")
        PY

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        tag_name: ${{ steps.metadata.outputs.tag }}
        name: "${{ steps.metadata.outputs.display_name }} ${{ steps.metadata.outputs.tag }}"
        body_path: release-body.md
        files: ${{ steps.metadata.outputs.archive }}
        allow_updates: true
